<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c6b4b" />
  <title>의자 뺏기 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="brand"><span>🐾</span><div><p>20인 실시간 파티 게임</p><h1>의자 뺏기 게임</h1></div></section>
    <section id="lobby" class="lobby card">
      <div class="lobby-copy"><span class="eyebrow">마지막 의자의 주인공은?</span><h2>음악이 멈추면<br />먼저 앉으세요!</h2><p>방향키로 움직이고, 대시와 밀치기로 의자를 차지하세요.</p></div>
      <form id="join-form" class="join-panel">
        <label>닉네임<input id="name" maxlength="10" autocomplete="off" placeholder="예: 용감한 토끼" required /></label>
        <button class="primary" type="button" id="create">새 방 만들기</button>
        <div class="or"><span>또는</span></div>
        <label>방 코드<input id="room-code" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC123" /></label>
        <button class="secondary" type="button" id="join">방 참가하기</button>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>
    <section id="room" class="room hidden">
      <header class="room-header card"><div><span class="eyebrow">방 코드</span><strong id="room-code-display">------</strong><button id="copy-room" class="copy" type="button">복사</button></div><div id="room-status">참가자를 기다리는 중</div><button id="start" class="primary">게임 시작</button></header>
      <div class="game-layout">
        <canvas id="game" width="960" height="640" aria-label="동물 의자 뺏기 경기장"></canvas>
        <aside class="side card"><div class="phase"><span id="phase-icon">🎵</span><div><b id="phase-title">대기 중</b><small id="phase-detail">방장이 게임을 시작하세요</small></div></div><div class="players-head">참가자 <b id="count">0 / 20</b></div><ol id="players"></ol><div class="controls"><b>조작 방법</b><p><kbd>← ↑ ↓ →</kbd> 이동</p><p><kbd>Space</kbd> 대시 · <kbd>Z</kbd> 밀치기</p><p><kbd>X</kbd> 바나나 설치</p></div></aside>
      </div>
    </section>
  </main>
  <script src="config.js"></script><script type="module" src="game.js"></script>
</body>
</html>
